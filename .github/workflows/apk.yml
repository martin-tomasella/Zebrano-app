name: APK Android

# Compila el APK con Gradle (sin EAS) y lo publica como Release "v<versionCode>".
# Se dispara al subir a main un cambio en app.json (subir versionCode) o en este archivo.
on:
  push:
    branches: [main]
    paths: ['app.json', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - id: v
        run: echo "tag=v$(node -p "require('./app.json').expo.android.versionCode")" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      # ponytail: firma con el keystore de debug que genera prebuild; para Play Store hace falta un keystore propio.
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: android
      - run: cp android/app/build/outputs/apk/release/app-release.apk zebrano-${{ steps.v.outputs.tag }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Zebrano ${{ steps.v.outputs.tag }}
          files: zebrano-${{ steps.v.outputs.tag }}.apk
