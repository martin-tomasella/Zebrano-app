name: APK Android

# Compila el APK con Gradle (sin EAS) y lo publica como Release del repo.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      # ponytail: firma con el keystore de debug que genera prebuild; para Play Store hace falta un keystore propio.
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: android
      - run: cp android/app/build/outputs/apk/release/app-release.apk zebrano-${{ github.ref_name }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: zebrano-${{ github.ref_name }}.apk
